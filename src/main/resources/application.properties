spring.application.name=banking-management-system
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}

# MySQL Datasource
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:banking_db}?createDatabaseIfNotExist=true&useSSL=${MYSQL_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Flyway
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:northstar-bank}
app.jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Security & Rate Limiting
app.security.max-login-attempts=${MAX_LOGIN_ATTEMPTS:5}
app.security.lock-duration-minutes=${LOGIN_LOCK_MINUTES:15}
app.security.rate-limit.api-per-minute=${API_RATE_LIMIT:120}
app.security.rate-limit.auth-per-minute=${AUTH_RATE_LIMIT:20}
app.security.rate-limit.transaction-per-minute=${TRANSACTION_RATE_LIMIT:30}
app.security.rate-limit.max-clients=${RATE_LIMIT_MAX_CLIENTS:10000}
app.security.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:false}
app.security.email-verification-expiration=${EMAIL_VERIFICATION_EXPIRATION:86400000}
app.security.password-reset-expiration=${PASSWORD_RESET_EXPIRATION:900000}
app.security.cookie-secure=${COOKIE_SECURE:false}
app.security.cookie-same-site=${COOKIE_SAME_SITE:Lax}

# CORS & Public URL
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:8080}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:${SERVER_PORT:8080}}

# Mail
app.mail.from=${MAIL_FROM:noreply@northstarbank.local}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

# Seed Data (disabled in prod)
app.seed.enabled=${SEED_DEMO_DATA:true}

# Browser Session Cookies
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie

# Error Handling
server.error.include-message=never
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

# Swagger / Springdoc
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
