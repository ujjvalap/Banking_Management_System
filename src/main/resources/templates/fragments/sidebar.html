<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="customerSidebar" class="sidebar">
    <div class="sidebar-title">Customer Banking</div>
    <nav class="sidebar-nav">
        <a th:href="@{/customer/dashboard}" th:classappend="${activePage == 'dashboard'} ? 'active' : ''">Overview</a>
        <a th:href="@{/customer/accounts}" th:classappend="${activePage == 'accounts'} ? 'active' : ''">My Accounts</a>
        <a th:href="@{/customer/open-account}" th:classappend="${activePage == 'open-account'} ? 'active' : ''">Open Account</a>

        <a th:href="@{/admin/dashboard}" th:classappend="${activePage == 'admin-dashboard'} ? 'active' : ''">Overview</a>
