<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/navbar :: head('Sign In — Northstar Bank')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <script th:src="@{/js/auth.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="auth-shell">
    <section class="auth-story">
        <div>
            <div class="brand">
                <span class="brand-icon">✳</span>
                <span>northstar<span class="brand-light">bank</span></span>
            </div>
            <span class="eyebrow" style="color:#e6a370; margin-top:36px;">Secure Access</span>
            <h1>Welcome back to calmer banking.</h1>
            <p>Access your savings and current accounts, execute instant transfers, and download verified statements.</p>
        </div>
        
    </section>

    <section class="auth-form-pane">
        <h2>Sign in</h2>
        <p class="auth-subtitle">Enter your registered email and password to continue.</p>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <input id="loginEmail" name="email" type="email" class="form-control" autocomplete="username" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="password-wrap">
                    <input id="loginPassword" name="password" type="password" class="form-control" autocomplete="current-password" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" data-toggle-password>Show</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary auth-submit">Sign In Securely</button>
        </form>

        <div class="auth-links">
            <a th:href="@{/auth/forgot-password}">Forgot password?</a>
            <span>New here? <a th:href="@{/auth/register}">Create an account</a></span>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
