<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/navbar :: head('Reset Password — Northstar Bank')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <script th:src="@{/js/auth.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="auth-shell">
    <section class="auth-story">
        <div>
            <div class="brand">
                <span class="brand-icon">✳</span>
                <span>northstar<span class="brand-light">bank</span></span>
            </div>
            <span class="eyebrow" style="color:#e6a370; margin-top:36px;">Password Reset</span>
            <h1>Set a strong new password.</h1>
            <p>All existing access tokens and refresh families are automatically invalidated after reset.</p>
        </div>
        <div class="auth-story-note">Tokens are single-use and expire automatically.</div>
    </section>

    <section class="auth-form-pane">
        <h2>Choose new password</h2>
        <p class="auth-subtitle">Use 12–72 characters with upper, lower, digit, and symbol.</p>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <form id="resetPasswordForm">
            <div class="form-group">
                <label for="resetNewPassword">New Password</label>
                <div class="password-wrap">
                    <input id="resetNewPassword" name="newPassword" type="password" class="form-control" minlength="12" maxlength="72" required>
                    <button type="button" class="password-toggle" data-toggle-password>Show</button>
                </div>
            </div>
            <div class="form-group">
                <label for="resetConfirmPassword">Confirm New Password</label>
                <div class="password-wrap">
                    <input id="resetConfirmPassword" name="confirmPassword" type="password" class="form-control" minlength="12" maxlength="72" required>
                    <button type="button" class="password-toggle" data-toggle-password>Show</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary auth-submit">Reset Password</button>
        </form>

        <div class="auth-links">
            <a th:href="@{/auth/login}">← Back to sign in</a>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
