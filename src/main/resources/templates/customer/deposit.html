<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/navbar :: head('Deposit — Northstar Bank')}"></th:block>
    <script th:src="@{/js/transactions.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="workspace-layout">
    <div th:replace="~{fragments/sidebar :: customerSidebar}"></div>

    <main class="main-content">
        <div class="page-header">
            <div>
                <span class="eyebrow">Instant Credit</span>
                <h1>Deposit Money</h1>
                <p>Add funds safely to any of your active accounts.</p>
            </div>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <section class="card form-card">
            <form id="depositForm">
                <div class="form-group">
                    <label for="depositAccountId">Select Active Account</label>
                    <select id="depositAccountId" name="accountId" class="form-control" required>
                        <option value="">Loading accounts...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="depositAmount">Amount (₹)</label>
                    <input id="depositAmount" name="amount" type="number" min="0.01" step="0.01" class="form-control" placeholder="1500.00" required>
                </div>
                <div class="form-group">
                    <label for="depositDescription">Description (optional)</label>
                    <input id="depositDescription" name="description" type="text" maxlength="200" class="form-control" placeholder="Salary or cash deposit">
                </div>
                <button type="submit" class="btn btn-primary">Confirm Deposit</button>
            </form>
        </section>
    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
