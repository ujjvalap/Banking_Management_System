<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/navbar :: head('My Accounts — Northstar Bank')}"></th:block>
    <script th:src="@{/js/accounts.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="workspace-layout">
    <div th:replace="~{fragments/sidebar :: customerSidebar}"></div>

    <main class="main-content">
        <div class="page-header">
            <div>
                <span class="eyebrow">Account Portfolio</span>
                <h1>My Bank Accounts</h1>
                <p>View balances, statuses, and statements for your savings and current accounts.</p>
            </div>
            <a th:href="@{/customer/open-account}" class="btn btn-primary">Open Account</a>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <section class="card">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Account Number</th>
                            <th>Type</th>
                            <th>Balance</th>
                            <th>Status</th>
                            <th>Opened</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="accountsTableBody">
                        <tr><td colspan="6" class="empty-state">Loading accounts...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
