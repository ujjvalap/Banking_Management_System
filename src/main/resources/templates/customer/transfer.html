<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/navbar :: head('Transfer — Northstar Bank')}"></th:block>
    <script th:src="@{/js/transactions.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="workspace-layout">
    <div th:replace="~{fragments/sidebar :: customerSidebar}"></div>

    <main class="main-content">
        <div class="page-header">
            <div>
                <span class="eyebrow">Atomic Transfer</span>
                <h1>Transfer Money</h1>
                <p>Send funds securely to another active Northstar account with a shared reference ID.</p>
            </div>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <section class="card form-card">
            <form id="transferForm">
                <div class="form-group">
                    <label for="fromAccountId">From Active Account</label>
                    <select id="fromAccountId" name="fromAccountId" class="form-control" required>
                        <option value="">Loading accounts...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="toAccountNumber">Destination Account Number</label>
                    <input id="toAccountNumber" name="toAccountNumber" type="text" maxlength="20" class="form-control" placeholder="NB000000000000" required>
                </div>
                <div class="form-group">
                    <label for="transferAmount">Amount (₹)</label>
                    <input id="transferAmount" name="amount" type="number" min="0.01" step="0.01" class="form-control" placeholder="250.00" required>
                </div>
                <div class="form-group">
                    <label for="transferDescription">Reference Note (optional)</label>
                    <input id="transferDescription" name="description" type="text" maxlength="200" class="form-control" placeholder="Invoice #104 or rent">
                </div>
                <button type="submit" class="btn btn-primary">Send Transfer</button>
            </form>
        </section>
    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
