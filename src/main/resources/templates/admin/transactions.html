<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/navbar :: head('Admin Transactions — Northstar Bank')}"></th:block>
    <script th:src="@{/js/admin.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="workspace-layout">
    <div th:replace="~{fragments/sidebar :: adminSidebar}"></div>

    <main class="main-content">
        <div class="page-header">
            <div>
                <span class="eyebrow">Global Ledger</span>
                <h1>System Transactions</h1>
                <p>Audit and filter transactions across all customer accounts by date and type.</p>
            </div>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <section class="card">
            <form id="adminTxFilterForm" class="filter-bar">
                <div class="form-group" style="margin:0;">
                    <label for="adminStartDate">Start Date</label>
                    <input id="adminStartDate" type="date" class="form-control">
                </div>
                <div class="form-group" style="margin:0;">
                    <label for="adminEndDate">End Date</label>
                    <input id="adminEndDate" type="date" class="form-control">
                </div>
                <div class="form-group" style="margin:0;">
                    <label for="adminTxType">Transaction Type</label>
                    <select id="adminTxType" class="form-control">
                        <option value="">All Types</option>
                        <option value="DEPOSIT">DEPOSIT</option>
                        <option value="WITHDRAW">WITHDRAW</option>
                        <option value="TRANSFER_IN">TRANSFER_IN</option>
                        <option value="TRANSFER_OUT">TRANSFER_OUT</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Filter Transactions</button>
            </form>
        </section>

        <section class="card">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Reference ID</th>
                            <th>Account</th>
                            <th>Type</th>
                            <th>Amount</th>
                            <th>Description</th>
                            <th>Timestamp</th>
                        </tr>
                    </thead>
                    <tbody id="adminTransactionsBody">
                        <tr><td colspan="6" class="empty-state">Loading transactions...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination-bar">
                <span id="adminTxPageInfo">Page 1</span>
                <div class="inline-actions">
                    <button id="adminPrevPage" type="button" class="btn btn-outline btn-sm">Previous</button>
                    <button id="adminNextPage" type="button" class="btn btn-outline btn-sm">Next</button>
                </div>
            </div>
        </section>
    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
