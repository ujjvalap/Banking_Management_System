<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/navbar :: head('Admin Customers — Northstar Bank')}"></th:block>
    <script th:src="@{/js/admin.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="workspace-layout">
    <div th:replace="~{fragments/sidebar :: adminSidebar}"></div>

    <main class="main-content">
        <div class="page-header">
            <div>
                <span class="eyebrow">Customer Directory</span>
                <h1>Registered Customers</h1>
                <p>Inspect customer profiles, KYC identifiers, and account counts.</p>
            </div>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <section class="card">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>PAN</th>
                            <th>Accounts</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="adminCustomersBody">
                        <tr><td colspan="7" class="empty-state">Loading customers...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
