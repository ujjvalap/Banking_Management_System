<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/navbar :: head('Northstar Bank — Notice')}"></th:block>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="hero-shell" style="grid-template-columns:1fr; max-width:600px;">
    <div class="card" style="text-align:center; padding:38px;">
        <span class="eyebrow" th:text="${'HTTP ' + (status != null ? status : 500)}">HTTP 500</span>
        <h1 style="margin-bottom:10px;" th:text="${error != null ? error : 'Unexpected Error'}">Unexpected Error</h1>
        <p class="field-hint" style="font-size:14px; margin-bottom:22px;"
           th:text="${message != null ? message : 'Something went wrong while processing your request.'}">Something went wrong.</p>
        <a th:href="@{/}" class="btn btn-primary">Return Home</a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
