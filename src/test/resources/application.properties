spring.datasource.url=jdbc:h2:mem:banking-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.jwt.issuer=northstar-bank
app.jwt.access-expiration=900000
app.jwt.refresh-expiration=604800000

app.security.require-email-verification=false
app.security.rate-limit.auth-per-minute=100
app.security.rate-limit.api-per-minute=500
app.security.rate-limit.transaction-per-minute=200
app.security.cookie-secure=false
app.seed.enabled=false
spring.mail.host=localhost
